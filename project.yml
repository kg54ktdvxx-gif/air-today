name: Air Today
options:
  bundleIdPrefix: com.airtoday
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  AirTodayCore:
    path: AirTodayCore
  AirTodayUI:
    path: AirTodayUI

targets:
  Air Today:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - AirTodayUITests
    sources:
      - path: AirTodayApp
      # App Intents types used by both the app (Siri) and the widgets.
      - path: Shared/Intents
    resources:
      - path: AirTodayApp/PrivacyInfo.xcprivacy
    dependencies:
      - package: AirTodayCore
      - package: AirTodayUI
      - target: AirTodayWidgetExtension
      # The Watch app is left out of 1.2.0 (its App IDs still need the shared App
      # Group in the developer portal). Re-add to ship it again:
      # - target: AirTodayWatch
    entitlements:
      path: AirTodayApp/AirToday.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.airtoday.shared
    settings:
      base:
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Air Today uses your location to show nearby air quality data."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        # Resizable (no UIRequiresFullScreen): iPhone Duo's inner display, iPad Split View and
        # Stage Manager, and the Mac window size the app; the layout adapts to the space. iPhone
        # stays portrait; a resizable iPad app declares every orientation.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: AirTodayApp/Info.plist
        # HTTPS only: exempt from export compliance, so App Store Connect needn't ask per build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.airtoday.app.liveactivity
        MARKETING_VERSION: "1.4.1"
        CURRENT_PROJECT_VERSION: 14
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        METAL_LIBRARY_OUTPUT_DIR: "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)"

  AirTodayWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AirTodayWidget
      - path: Shared/Intents
    resources:
      - path: AirTodayWidget/Assets.xcassets
      - path: AirTodayWidget/PrivacyInfo.xcprivacy
    dependencies:
      - package: AirTodayCore
    info:
      path: AirTodayWidget/Info.plist
      properties:
        CFBundleDisplayName: "Air Today Widget"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airtoday.app.liveactivity.widget
        MARKETING_VERSION: "1.4.1"
        CURRENT_PROJECT_VERSION: 14
        GENERATE_INFOPLIST_FILE: true
    entitlements:
      path: AirTodayWidget/AirTodayWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.airtoday.shared

  AirTodayWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: AirTodayWatch
    resources:
      - path: AirTodayWatch/PrivacyInfo.xcprivacy
    dependencies:
      - package: AirTodayCore
      - target: AirTodayWatchWidget
    entitlements:
      path: AirTodayWatch/AirTodayWatch.entitlements
      properties:
        # The Watch's own group (separate container from the iPhone's), shared
        # between the Watch app and its complications.
        com.apple.security.application-groups:
          - group.com.airtoday.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airtoday.app.liveactivity.watchkitapp
        MARKETING_VERSION: "1.4.1"
        CURRENT_PROJECT_VERSION: 14
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Air Today
        INFOPLIST_KEY_WKApplication: true
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.airtoday.app.liveactivity
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: false
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Air Today uses your location to show nearby air quality on your Watch."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  AirTodayWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: AirTodayWatchWidget
    resources:
      - path: AirTodayWatchWidget/PrivacyInfo.xcprivacy
    dependencies:
      - package: AirTodayCore
    info:
      path: AirTodayWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: "Air Today"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AirTodayWatchWidget/AirTodayWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.airtoday.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airtoday.app.liveactivity.watchkitapp.widget
        MARKETING_VERSION: "1.4.1"
        CURRENT_PROJECT_VERSION: 14
        GENERATE_INFOPLIST_FILE: true

  AirTodayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AirTodayUITests
    dependencies:
      - target: Air Today
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airtoday.app.liveactivity.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Air Today
